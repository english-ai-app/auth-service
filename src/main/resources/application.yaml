server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_service?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Bangkok}
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    protocol: smtp
    username: ${MAIL_USER:hduc18535@gmail.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.from: ${MAIL_FROM:${MAIL_USER:hduc18535@gmail.com}}
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  tracing:
    sampling:
      probability: 0.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: info,health,prometheus

logging:
  level:
    org:
      springframework:
        ws: INFO
        security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

maxFailedLoginAttempt: 5

oauth:
  properties:
    default-access-token-timeout: 3600
    default-refresh-token-timeout: 86400
